<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haryanvi MST Ji Music</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}
.player{max-width:700px;margin:30px auto;padding:28px 22px;border:1px solid #333;border-radius:20px;background:linear-gradient(145deg,#111,#050505);box-shadow:0 10px 35px #000}
h1{text-align:center;margin:0 0 6px;font-size:28px}.sub{text-align:center;color:#aaa;margin-bottom:28px}
.cover{height:210px;border-radius:16px;background:linear-gradient(135deg,#201307,#000);display:flex;align-items:center;justify-content:center;text-align:center;font-size:34px;font-weight:800;letter-spacing:1px;margin-bottom:22px}
#title{text-align:center;font-size:20px;font-weight:700;margin-bottom:12px}
input[type=range]{width:100%;accent-color:#f2b233}
.times{display:flex;justify-content:space-between;color:#aaa;font-size:12px}
.controls{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:22px}
button{border:0;border-radius:50%;width:56px;height:56px;background:#222;color:#fff;font-size:23px;cursor:pointer}
button:hover{background:#333}.main{width:72px;height:72px;background:#e0a52a;color:#000;font-size:30px}
.playlist{margin-top:25px;border-top:1px solid #333;padding-top:15px}
.song{padding:12px;border-radius:10px;cursor:pointer;color:#ddd}.song.active{background:#1d1d1d;color:#f2b233}
</style>
</head>
<body>
<div class="player">
  <div class="cover">HARYANVI<br>MST JI MUSIC</div>
  <h1>Haryanvi MST Ji Music</h1>
  <div class="sub">Desi Beats • Music Player</div>
  <div id="title">Haryanvi Song 1</div>
  <input id="progress" type="range" min="0" max="100" value="0">
  <div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
  <div class="controls">
    <button id="back" title="Previous">⏮</button>
    <button id="play" class="main" title="Play/Pause">▶</button>
    <button id="next" title="Next">⏭</button>
  </div>
  <div class="playlist" id="playlist"></div>
  <audio id="audio" preload="metadata"></audio>
</div>
<script>
const songs=[
  {title:"Haryanvi Song 1",src:"songs/Haryanvi%20Song%201.mpeg"},
  {title:"Haryanvi Song 2",src:"songs/Haryanvi%20Song%202.mpeg"}
];
let i=0; const a=document.getElementById("audio"), play=document.getElementById("play"),
title=document.getElementById("title"), prog=document.getElementById("progress"),
cur=document.getElementById("current"), dur=document.getElementById("duration"), list=document.getElementById("playlist");
function fmt(s){if(!isFinite(s))return"0:00";return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")}
function load(n,autoplay=false){i=(n+songs.length)%songs.length;a.src=songs[i].src;title.textContent=songs[i].title;list.innerHTML="";
songs.forEach((s,k)=>{let d=document.createElement("div");d.className="song"+(k===i?" active":"");d.textContent=(k+1)+". "+s.title;d.onclick=()=>load(k,true);list.appendChild(d)});
if(autoplay)a.play()}
play.onclick=()=>a.paused?a.play():a.pause();
a.onplay=()=>play.textContent="⏸"; a.onpause=()=>play.textContent="▶";
a.ontimeupdate=()=>{prog.value=a.duration?(a.currentTime/a.duration*100):0;cur.textContent=fmt(a.currentTime)};
a.onloadedmetadata=()=>dur.textContent=fmt(a.duration);
prog.oninput=()=>{if(a.duration)a.currentTime=prog.value/100*a.duration};
document.getElementById("next").onclick=()=>load(i+1,true);
document.getElementById("back").onclick=()=>load(i-1,true);
a.onended=()=>load(i+1,true); load(0);
</script>
</body>
</html>
